download:
  url: https://pureportal.strath.ac.uk/files/180681715/PlegmaDataset_Clean.7z
  archive_name: PlegmaDataset_Clean.7z
  landing_page: https://doi.org/10.15129/3b01a6c6-2efd-424a-b8b8-5fe7fa445ded
prepare:
  clock: fixed_utc3
  min_coverage: 0.8
  min_load_w: 1.0
  timezone: Europe/Athens
features:
  weather: actual
  use_house_id: false
  use_static: true
  lag_days:
  - 1
  - 2
  - 3
  - 7
  - 14
  scale_window_days: 28
  scale_min_days: 7
  min_hours_per_day: 18
  vacation_periods:
  - - 08-01
    - 08-31
  - - 12-24
    - 01-06
  tariff_regimes:
  - name: night_tariff_classic
    valid_until: '2025-01-31'
    seasons:
    - months:
      - 11
      - 12
      - 1
      - 2
      - 3
      - 4
      windows:
      - - 2
        - 8
      - - 15
        - 17
    - months:
      - 5
      - 6
      - 7
      - 8
      - 9
      - 10
      windows:
      - - 23
        - 7
  - name: two_zone
    valid_from: '2025-02-01'
    seasons:
    - months:
      - 11
      - 12
      - 1
      - 2
      - 3
      windows:
      - - 2
        - 5
      - - 12
        - 15
    - months:
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
      - 10
      windows:
      - - 2
        - 4
      - - 11
        - 15
cv:
  first_test_month: 2023-01
  last_test_month: null
  val_days: 28
  min_test_days: 7
  min_local_train_days: 60
model:
  objective: tweedie
  learning_rate: 0.05
  num_leaves: 31
  min_data_in_leaf: 40
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  max_rounds: 3000
  early_stopping_rounds: 150
  default_rounds: 500
  seed: 42
  num_threads: 0
